name: tracker_mobile
description: Silent mobile monitoring app with spacebar screenshot, call monitoring, and on-demand data pull.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client
  http: ^1.2.0
  # Secure storage for API tokens
  flutter_secure_storage: ^9.0.0
  # Background work scheduling (hourly call log sync)
  workmanager: ^0.5.2
  # Firebase messaging for silent push
  firebase_messaging: ^14.7.0
  firebase_core: ^2.25.0
  # Device info
  device_info_plus: ^10.0.0
  # Location
  geolocator: ^11.0.0
  # Path utilities
  path_provider: ^2.1.0
  # Image compression
  flutter_image_compress: ^2.1.0
  # Shared preferences for simple config
  shared_preferences: ^2.2.0
  # Permission handler
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
